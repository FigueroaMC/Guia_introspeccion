name: Mantener Supabase activo

# Supabase pausa los proyectos del plan gratuito tras 7 dias sin actividad.
# Esta tarea hace una consulta ligera a diario para que el proyecto registre uso.
# La llave es la publica (anon) que ya esta en index.html; solo puede insertar, no leer.

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la base
        run: |
          curl --fail --silent --show-error --max-time 60 \
